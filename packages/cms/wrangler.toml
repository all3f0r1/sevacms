name = "flare-cms-dev"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers settings
workers_dev = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "my-astro-cms-db"
database_id = "a2fe8bde-3cb8-4c0b-8a66-a996c482e5a3"
migrations_dir = "./node_modules/@flare-cms/core/migrations"

# R2 Bucket for media storage
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "my-astro-cms-media"

# KV Namespace for rate limiting cache
[[kv_namespaces]]
binding = "CACHE_KV"
id = "7dacbabdf6aa4896b0c9b0bc7b9125fe"

# Environment variables
[vars]
ENVIRONMENT = "development"
CORS_ORIGINS = "http://localhost:4321,http://localhost:8787"
MEDIA_DOMAIN = "images.flarecms.dev"

# Webhook configuration (Phase 4)
# Comma-separated URLs to POST on content publish/unpublish events
# Leave empty to disable webhooks; fill in a URL to test locally
WEBHOOK_URLS = ""
# Shared secret for HMAC-SHA256 webhook signatures
# Leave empty to send unsigned webhooks (a console.warn will be logged)
# Production values should be set in [env.production] below
WEBHOOK_SECRET = ""

# Production environment
# No resource ids: wrangler auto-provisions D1/R2/KV on the deploying account.
# Migrations run at runtime (core bootstrap middleware).
[env.production]
name = "sevacms"
vars = { ENVIRONMENT = "production", CORS_ORIGINS = "", WEBHOOK_URLS = "", WEBHOOK_SECRET = "" }

[[env.production.d1_databases]]
binding = "DB"
migrations_dir = "./node_modules/@flare-cms/core/migrations"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"

# Cron triggers for scheduled content publishing
[triggers]
crons = ["* * * * *"]

# Observability
[observability]
enabled = true
